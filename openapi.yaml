openapi: 3.0.3
info:
  title: Rent Etalans API
  version: 1.1.0
servers:
  - url: http://localhost:8000/api
security: []
paths:
  /auth/login:
    post:
      summary: Login admin or client user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - password
              properties:
                name:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Authenticated user and bearer token
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - user
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me:
    get:
      summary: Get current authenticated user
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /services/visible:
    get:
      summary: List services visible to clients
      tags:
        - Services
      responses:
        "200":
          description: Visible services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCollection"
  /services:
    get:
      summary: List all services for admin panel
      tags:
        - Services
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All services, including hidden services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCollection"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create service
      tags:
        - Services
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - price
                - description
                - fixed_price
                - images
              properties:
                name:
                  type: string
                  maxLength: 30
                price:
                  type: number
                  minimum: 0
                description:
                  type: string
                  maxLength: 500
                visible:
                  type: boolean
                  default: true
                fixed_price:
                  type: boolean
                  description: True when the service price is fixed, false when it depends on stay duration.
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /services/{serviceId}:
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: Show service
      tags:
        - Services
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update service
      tags:
        - Services
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdateInput"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Delete service
      tags:
        - Services
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Service deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  responses:
    Unauthorized:
      description: Token is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
  schemas:
    AuthUser:
      type: object
      required:
        - id
        - name
        - tg_nickname
        - role
      properties:
        id:
          type: integer
        name:
          type: string
        tg_nickname:
          type: string
        role:
          type: string
          enum:
            - superadmin
            - admin
            - client
    Service:
      type: object
      required:
        - id
        - name
        - description
        - visible
        - fixed_price
        - price
        - images
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        visible:
          type: boolean
          description: True when clients can see and buy this service.
        fixed_price:
          type: boolean
          description: True for fixed service price, false when price depends on stay duration.
        price:
          type: number
        images:
          type: array
          items:
            $ref: "#/components/schemas/ServiceImage"
    ServiceImage:
      type: object
      required:
        - id
        - filename
        - path
        - url
      properties:
        id:
          type: integer
        filename:
          type: string
        path:
          type: string
        url:
          type: string
          format: uri
    ServiceCollection:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Service"
    ServiceUpdateInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 30
        price:
          type: number
          minimum: 0
        description:
          type: string
          maxLength: 500
        visible:
          type: boolean
        fixed_price:
          type: boolean
    Error:
      type: object
      properties:
        message:
          type: string
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
