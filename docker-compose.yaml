services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
      - admin_panel
      - api
    ports:
      - "80:80"
      - "8080:8080"
      - "8000:8000"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped

  app:
    build:
      context: ./app
    depends_on:
      - api
      - telegram_bot
    restart: unless-stopped

  admin_panel:
    build:
      context: ./admin_panel
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  telegram_bot:
    build:
      context: ./telegram_bot
    volumes:
      - telegram_bot_data:/data
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rent_etalans}
      MYSQL_USER: ${DB_USERNAME:-rent_etalans}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rent_etalans}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  telegram_bot_data:
